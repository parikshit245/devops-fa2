{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulseops.fullname" . }}-prometheus-config
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval | quote }}
    scrape_configs:
      - job_name: pulseops-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - {{ printf "%s-backend:%v" (include "pulseops.fullname" .) .Values.backend.service.port | quote }}
{{- end }}