{{- if .Values.monitoring.enabled }}
{{- $fullname := include "pulseops.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-prometheus-config
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.monitoring.prometheus.evaluationInterval }}
      external_labels:
        cluster: {{ .Release.Name }}

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # Prometheus monitors itself (scrape health, TSDB size, rule evaluation).
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # PulseOps FastAPI backend: /metrics (golden signals + synthetic checks).
      - job_name: pulseops-backend
        metrics_path: /metrics
        {{- if .Values.monitoring.prometheus.kubernetesSD }}
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          # Keep only this release's backend pods that opt in via prometheus.io/scrape.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: {{ .Release.Name }};backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        {{- else }}
        static_configs:
          - targets:
              - {{ printf "%s-backend:%v" $fullname .Values.backend.service.port | quote }}
        {{- end }}

      {{- if .Values.monitoring.nodeExporter.enabled }}

      # Host metrics of the EC2 node (CPU, memory, swap, disk, network).
      - job_name: node-exporter
        static_configs:
          - targets: [{{ printf "%s-node-exporter:9100" $fullname | quote }}]
            labels:
              node: ec2-k3s
      {{- end }}

      {{- if .Values.monitoring.prometheus.scrapeCadvisor }}

      # Per-container CPU / memory from the kubelet's cAdvisor, via the API server proxy.
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # Keep only the handful of series the dashboards/alerts use (keeps Prometheus small).
          - source_labels: [__name__]
            regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|oom_events_total|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|network_receive_bytes_total|network_transmit_bytes_total)
            action: keep
          - source_labels: [container]
            regex: POD
            action: drop
      {{- end }}
{{- end }}
