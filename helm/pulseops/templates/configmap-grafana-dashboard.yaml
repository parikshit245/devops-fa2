{{- if .Values.monitoring.enabled }}
# Dashboards are provisioned from helm/pulseops/files/grafana/*.json (also reused by compose.yaml locally).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulseops.fullname" . }}-grafana-dashboard
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/grafana/*.json").AsConfig | nindent 2 }}
{{- end }}
