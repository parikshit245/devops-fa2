{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulseops.fullname" . }}-prometheus
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: {{ .Values.monitoring.prometheus.service.type }}
  selector:
    {{- include "pulseops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      {{- if eq .Values.monitoring.prometheus.service.type "NodePort" }}
      nodePort: {{ .Values.monitoring.prometheus.service.nodePort }}
      {{- end }}
{{- end }}
