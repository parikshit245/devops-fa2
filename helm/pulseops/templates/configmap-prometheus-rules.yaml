{{- if .Values.monitoring.enabled }}
# Recording rules (SLIs) and alerting rules (SLO burn rate, outages, saturation).
# Source of truth: helm/pulseops/files/prometheus/*.yaml (validated in CI with promtool).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulseops.fullname" . }}-prometheus-rules
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/prometheus/*.yaml").AsConfig | nindent 2 }}
{{- end }}
