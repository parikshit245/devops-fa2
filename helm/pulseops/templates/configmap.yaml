apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulseops.fullname" . }}-config
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
data:
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  JWT_EXPIRE_MINUTES: {{ .Values.config.jwtExpireMinutes | quote }}
