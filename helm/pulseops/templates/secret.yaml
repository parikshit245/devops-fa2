{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ include "pulseops.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database }}"
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{ .Values.secrets.keys.grafanaAdminPassword }}: {{ .Values.secrets.grafanaAdminPassword | quote }}
{{- end }}
