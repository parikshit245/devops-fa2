name: pulseops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops-local-only}
    volumes:
      - pulseops-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pulseops-internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pulseops}:${POSTGRES_PASSWORD:-pulseops-local-only}@db:5432/${POSTGRES_DB:-pulseops}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-before-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3005}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [pulseops-internal]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    networks: [pulseops-internal]

  # ---- Monitoring (optional):  podman compose --profile monitoring up -d ----
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./helm/pulseops/files/prometheus:/etc/prometheus/rules:ro,z
      - pulseops-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [backend]
    networks: [pulseops-internal]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pulseops-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pulseops-sre-overview.json
    volumes:
      - ./monitoring/compose/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro,z
      - ./monitoring/compose/grafana/dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/dashboard-provider.yaml:ro,z
      - ./helm/pulseops/files/grafana:/etc/grafana/dashboards:ro,z
      - pulseops-grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus]
    networks: [pulseops-internal]

volumes:
  pulseops-db-data:
  pulseops-prometheus-data:
  pulseops-grafana-data:

networks:
  pulseops-internal:
    driver: bridge
