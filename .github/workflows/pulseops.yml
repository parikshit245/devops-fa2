name: PulseOps CI/CD

# Build -> Test -> Scan -> Package -> Deploy
#   test      : lint + build frontend, pytest backend, helm lint/template + kubeconform, promtool rule tests
#   security  : DevSecOps gates - Bandit (Python SAST), Trivy (dependencies, secrets, IaC misconfig)
#   publish   : build both images, scan them with Trivy, push to GHCR tagged with the commit SHA + latest
#   deploy    : (opt-in) copy the chart to the EC2 k3s node over SSH and run scripts/deploy.sh
#               (helm --atomic rolling update, smoke test, automatic rollback on failure)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseops-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: "0.69.3"  # v0.69.4 was the malicious build in the March 2026 supply-chain attack; never use trivy-action tags
  KUBECONFORM_VERSION: "0.6.7"
  PROMETHEUS_VERSION: "2.55.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Frontend ----------
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: ""

      # ---------- Backend ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Unit tests
        run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - name: Grafana dashboards are up to date with the generator
        run: |
          python monitoring/generate_dashboards.py
          git diff --ignore-cr-at-eol --exit-code helm/pulseops/files/grafana/

      # ---------- Kubernetes manifests ----------
      - uses: azure/setup-helm@v4
      - name: Helm lint + render (default and micro profiles)
        run: |
          helm lint helm/pulseops
          helm lint helm/pulseops -f helm/pulseops/values-micro.yaml
          helm template pulseops helm/pulseops -n pulseops > rendered-default.yaml
          helm template pulseops helm/pulseops -n pulseops -f helm/pulseops/values-micro.yaml > rendered-micro.yaml
      - name: Validate rendered manifests against the Kubernetes schema (kubeconform)
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          ./kubeconform -strict -summary rendered-default.yaml rendered-micro.yaml

      # ---------- Monitoring as code ----------
      - name: Prometheus rules - syntax check + unit tests (promtool)
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          ./promtool check rules helm/pulseops/files/prometheus/*.yaml
          ./promtool test rules monitoring/tests/*.test.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Trivy
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz trivy
          sudo mv trivy /usr/local/bin/
      - name: SAST - Bandit (fails on HIGH severity issues in backend code)
        run: |
          pip install bandit==1.8.0
          bandit -r backend/app -lll
      - name: Secret scan - Trivy (fails if a credential is committed)
        run: trivy fs --scanners secret --exit-code 1 --skip-dirs node_modules .
      - name: Dependency scan - Trivy (Python + pnpm lockfiles)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 .
      - name: IaC scan - Trivy misconfiguration (Dockerfiles, Helm chart)
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 .

  publish-images:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image owner (GHCR requires lowercase)
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pulseops-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/pulseops-frontend:latest
          # Empty = browser calls /api/... on the same host, so one image works on any IP or domain.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pulseops-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/pulseops-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Scan pushed images - Trivy (report HIGH/CRITICAL)
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz trivy
          for img in pulseops-backend pulseops-frontend; do
            ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "ghcr.io/${OWNER}/${img}:${{ github.sha }}"
          done

  deploy:
    needs: publish-images
    if: github.ref == 'refs/heads/main' && vars.PULSEOPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy chart + scripts to EC2
        run: |
          tar czf deploy-bundle.tgz helm scripts
          scp -i ~/.ssh/ec2.pem deploy-bundle.tgz "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/"
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'rm -rf ~/pulseops && mkdir -p ~/pulseops && tar xzf /tmp/deploy-bundle.tgz -C ~/pulseops'
      - name: Helm rolling update on k3s (auto-rollback on failure)
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "GHCR_OWNER='${{ github.repository_owner }}' GHCR_USER='${{ github.repository_owner }}' GHCR_TOKEN='${{ secrets.GHCR_READ_TOKEN }}' \
             bash ~/pulseops/scripts/deploy.sh '${{ needs.publish-images.outputs.tag }}'"
      - name: External smoke test
        run: |
          curl -fsS -o /dev/null "http://${{ secrets.EC2_HOST }}/login"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://${{ secrets.EC2_HOST }}/api/v1/auth/me)" = "401"
